<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f1ec;
    --surface: #ffffff;
    --ink: #1b1b1f;
    --muted: #6b6a70;
    --line: #e2dfd8;
    --red: #d7263d;
    --red-dark: #a51c2f;
    --ok: #2e8b57;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417;
      --surface: #1e1e23;
      --ink: #f1f0ee;
      --muted: #9b9aa1;
      --line: #2e2e35;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Space Grotesk", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* Cabeçalho estilo "aparelho" da Pokédex */
  header {
    background: var(--red);
    color: #fff;
    padding: 20px 16px;
    border-bottom: 6px solid var(--red-dark);
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .lens {
    width: 52px; height: 52px; flex-shrink: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #bfe9ff, #2b9bd8 55%, #13608c);
    border: 4px solid #fff;
    box-shadow: 0 0 0 3px var(--red-dark);
  }
  .leds { display: flex; gap: 6px; }
  .leds span { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--red-dark); }
  .leds span:nth-child(1) { background: #ff5964; }
  .leds span:nth-child(2) { background: #ffd23f; }
  .leds span:nth-child(3) { background: #3bceac; }
  header h1 { font-size: 1.6rem; letter-spacing: .02em; }
  header p { font-size: .85rem; opacity: .85; }
  .count {
    margin-left: auto;
    font-family: "JetBrains Mono", monospace;
    background: rgba(0,0,0,.2);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: .85rem;
    white-space: nowrap;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 48px;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  /* Formulário */
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    position: sticky;
    top: 16px;
  }
  @media (max-width: 820px) { .panel { position: static; } }
  .panel h2 { font-size: 1.1rem; margin-bottom: 4px; }
  .panel .sub { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .panel.editing { border-color: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 18%, transparent); }
  label { display: block; font-size: .8rem; font-weight: 500; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%;
    font: inherit;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--red); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .erro-campo { color: var(--red); font-size: .75rem; min-height: 1em; margin-top: 3px; }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  button {
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
  }
  .btn-primary { background: var(--red); color: #fff; flex: 1; }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn-ghost:hover { color: var(--ink); }

  /* Lista */
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; }
  .toolbar input { background: var(--surface); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 5px solid var(--tipo, var(--muted));
    transition: transform .15s;
  }
  .card:hover { transform: translateY(-2px); }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; }
  .codigo { font-family: "JetBrains Mono", monospace; color: var(--muted); font-size: .8rem; }
  .card h3 { font-size: 1.2rem; }
  .badge {
    align-self: flex-start;
    background: var(--tipo, var(--muted));
    color: #fff;
    font-size: .75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .stats div { background: var(--bg); border-radius: 8px; padding: 6px 4px; }
  .stats b { display: block; font-family: "JetBrains Mono", monospace; font-size: .95rem; }
  .stats small { color: var(--muted); font-size: .7rem; }
  .card-actions { display: flex; gap: 6px; margin-top: auto; }
  .card-actions button { flex: 1; padding: 8px; font-size: .85rem; }
  .btn-edit { background: var(--bg); color: var(--ink); }
  .btn-edit:hover { background: var(--line); }
  .btn-del { background: transparent; color: var(--red); border: 1px solid var(--line); }
  .btn-del:hover { background: var(--red); color: #fff; }

  .vazio {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 48px 16px;
    border: 2px dashed var(--line);
    border-radius: var(--radius);
  }

  .toast {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: 10px;
    transition: transform .25s;
    max-width: calc(100% - 32px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.erro { background: var(--red); color: #fff; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="lens"></div>
    <div>
      <div class="leds"><span></span><span></span><span></span></div>
      <h1>Pokédex</h1>
      <p>Jefferson Faria de Oliveira · RM 573038</p>
    </div>
    <div class="count" id="count">0 pokémons</div>
  </div>
</header>

<main>
  <form class="panel" id="form" novalidate>
    <h2 id="form-titulo">Novo pokémon</h2>
    <p class="sub" id="form-sub">Preencha os dados para cadastrar (POST).</p>

    <label for="nome">Nome</label>
    <input id="nome" name="nome" maxlength="100">
    <div class="erro-campo" data-campo="nome"></div>

    <label for="tipo">Tipo</label>
    <input id="tipo" name="tipo" maxlength="50" list="tipos">
    <datalist id="tipos">
      <option>Água</option><option>Fogo</option><option>Planta</option><option>Elétrico</option>
      <option>Psíquico</option><option>Pedra</option><option>Normal</option><option>Fantasma</option>
      <option>Gelo</option><option>Dragão</option><option>Inseto</option><option>Voador</option>
    </datalist>
    <div class="erro-campo" data-campo="tipo"></div>

    <div class="row">
      <div>
        <label for="nivel">Nível</label>
        <input id="nivel" name="nivel" type="number" min="1" max="100">
        <div class="erro-campo" data-campo="nivel"></div>
      </div>
      <div>
        <label for="peso">Peso (kg)</label>
        <input id="peso" name="peso" type="number" step="0.1" min="0">
        <div class="erro-campo" data-campo="peso"></div>
      </div>
    </div>

    <label for="dataDaCaptura">Data da captura</label>
    <input id="dataDaCaptura" name="dataDaCaptura" type="date">
    <div class="erro-campo" data-campo="dataDaCaptura"></div>

    <div class="actions">
      <button type="submit" class="btn-primary" id="btn-salvar">Cadastrar</button>
      <button type="button" class="btn-ghost" id="btn-cancelar" hidden>Cancelar</button>
    </div>
  </form>

  <section>
    <div class="toolbar">
      <input id="busca" placeholder="Buscar por nome ou tipo...">
    </div>
    <div class="grid" id="lista"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  const API = "/pokedex";

  const CORES_TIPO = {
    "água": "#3b82c4", "fogo": "#e8622c", "planta": "#3f9e4d", "elétrico": "#e0a800",
    "psíquico": "#d6457e", "pedra": "#9c8848", "normal": "#8a8a78", "fantasma": "#6a4f9c",
    "gelo": "#4fb3bf", "dragão": "#5a3fd1", "inseto": "#8aa61c", "voador": "#7d8fd8"
  };

  const form = document.getElementById("form");
  const lista = document.getElementById("lista");
  const busca = document.getElementById("busca");
  let pokemons = [];
  let codigoEditando = null;

  function toast(msg, erro = false) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (erro ? " erro" : "");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.className = "toast", 2800);
  }

  function escapar(texto) {
    const div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML;
  }

  async function carregar() {
    try {
      const resp = await fetch(API);
      pokemons = resp.ok ? await resp.json() : [];
    } catch {
      pokemons = [];
      toast("Não foi possível conectar à API", true);
    }
    renderizar();
  }

  function renderizar() {
    const termo = busca.value.trim().toLowerCase();
    const filtrados = pokemons.filter(p =>
      p.nome.toLowerCase().includes(termo) || p.tipo.toLowerCase().includes(termo));

    document.getElementById("count").textContent =
      pokemons.length + (pokemons.length === 1 ? " pokémon" : " pokémons");

    if (filtrados.length === 0) {
      lista.innerHTML = `<div class="vazio">${pokemons.length ? "Nenhum pokémon encontrado." : "A Pokédex está vazia. Cadastre o primeiro!"}</div>`;
      return;
    }

    lista.innerHTML = filtrados.map(p => {
      const cor = CORES_TIPO[p.tipo.toLowerCase()] || "#8a8a78";
      const data = p.dataDaCaptura.split("-").reverse().join("/");
      return `
        <article class="card" style="--tipo:${cor}">
          <div class="card-top">
            <h3>${escapar(p.nome)}</h3>
            <span class="codigo">#${String(p.codigo).padStart(3, "0")}</span>
          </div>
          <span class="badge">${escapar(p.tipo)}</span>
          <div class="stats">
            <div><b>${p.nivel}</b><small>nível</small></div>
            <div><b>${p.peso}</b><small>kg</small></div>
            <div><b>${data.slice(0, 5)}</b><small>${data.slice(6)}</small></div>
          </div>
          <div class="card-actions">
            <button class="btn-edit" onclick="editar(${p.codigo})">Editar</button>
            <button class="btn-del" onclick="excluir(${p.codigo})">Excluir</button>
          </div>
        </article>`;
    }).join("");
  }

  function limparErros() {
    document.querySelectorAll(".erro-campo").forEach(e => e.textContent = "");
  }

  function modoCadastro() {
    codigoEditando = null;
    form.reset();
    limparErros();
    form.classList.remove("editing");
    document.getElementById("form-titulo").textContent = "Novo pokémon";
    document.getElementById("form-sub").textContent = "Preencha os dados para cadastrar (POST).";
    document.getElementById("btn-salvar").textContent = "Cadastrar";
    document.getElementById("btn-cancelar").hidden = true;
  }

  function editar(codigo) {
    const p = pokemons.find(x => x.codigo === codigo);
    if (!p) return;
    codigoEditando = codigo;
    limparErros();
    for (const campo of ["nome", "tipo", "nivel", "peso", "dataDaCaptura"]) {
      form.elements[campo].value = p[campo];
    }
    form.classList.add("editing");
    document.getElementById("form-titulo").textContent = "Editando " + p.nome;
    document.getElementById("form-sub").textContent = "Altere os dados e salve para atualizar (PUT /pokedex/" + codigo + ").";
    document.getElementById("btn-salvar").textContent = "Salvar alterações";
    document.getElementById("btn-cancelar").hidden = false;
    form.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  async function excluir(codigo) {
    const p = pokemons.find(x => x.codigo === codigo);
    if (!confirm("Excluir " + (p ? p.nome : "este pokémon") + "?")) return;
    const resp = await fetch(API + "/" + codigo, { method: "DELETE" });
    if (resp.status === 204) {
      toast("Pokémon excluído");
      if (codigoEditando === codigo) modoCadastro();
      carregar();
    } else {
      toast("Pokémon não encontrado", true);
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    limparErros();
    const dados = {
      nome: form.nome.value.trim(),
      tipo: form.tipo.value.trim(),
      nivel: form.nivel.value === "" ? null : Number(form.nivel.value),
      peso: form.peso.value === "" ? null : Number(form.peso.value),
      dataDaCaptura: form.dataDaCaptura.value || null
    };

    const editando = codigoEditando !== null;
    const resp = await fetch(editando ? API + "/" + codigoEditando : API, {
      method: editando ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dados)
    });

    if (resp.status === 201) {
      toast(editando ? "Pokémon atualizado!" : "Pokémon cadastrado!");
      modoCadastro();
      carregar();
      return;
    }

    // 400: o Bean Validation devolve { campo: mensagem }; o BO devolve texto
    const texto = await resp.text();
    try {
      const erros = JSON.parse(texto);
      for (const [campo, msg] of Object.entries(erros)) {
        const alvo = document.querySelector(`.erro-campo[data-campo="${campo}"]`);
        if (alvo) alvo.textContent = msg; else toast(msg, true);
      }
    } catch {
      toast(texto || "Erro ao salvar", true);
    }
  });

  document.getElementById("btn-cancelar").addEventListener("click", modoCadastro);
  busca.addEventListener("input", renderizar);

  carregar();
</script>
</body>
</html>
